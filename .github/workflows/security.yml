name: security

# 배포 전 보안 점검. main 푸시·PR마다 실행된다.
# Vercel 프로젝트의 Deployment Checks에 `security-review`를 필수로 등록하면,
# 실패한 커밋은 pickhub.site로 승격되지 않는다.
# 배포 후 실사이트 점검은 security-live.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 비밀정보 스캔은 전체 이력을 본다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 정적 보안 점검 (HTML·JS·민감파일·보안 헤더 설정)
        run: python3 scripts/security_check.py

      - name: 비밀정보 유출 스캔 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
