name: security-live

# 배포 후 보안 점검. 운영 배포 완료(Vercel deployment_status)와 매주 월요일에
# 실제 사이트의 보안 헤더·노출 경로를 확인하고 ZAP 기본 스캔 보고서를 남긴다.

on:
  deployment_status:
  schedule:
    - cron: "17 0 * * 1" # 매주 월 09:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://pickhub.site' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 배포 사이트 보안 헤더·노출 경로 점검
        # 배포 직후 도메인 반영이 늦을 수 있어 최대 5분 재시도
        run: python3 scripts/check_live_headers.py "$SITE_URL" --wait 300

      - name: OWASP ZAP 기본 스캔 (보고서만, 실패 처리 안 함)
        if: always()
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$SITE_URL" -r zap-report.html -J zap-report.json -I || true

      - name: ZAP 보고서 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
          retention-days: 30
